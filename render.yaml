# Render Blueprint — one Web Service = full working InternRoute URL
# Dashboard: New → Blueprint → connect this repo

services:
  - type: web
    name: internroute
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:////data/internroute.db
      - key: CHROMA_PERSIST_DIRECTORY
        value: /data/chroma_data
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: CORS_ORIGINS
        value: "*"
      - key: GEMINI_API_KEY
        sync: false
    disk:
      name: internroute-data
      mountPath: /data
      sizeGB: 1
